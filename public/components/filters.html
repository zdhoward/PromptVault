<div class="max-w-7xl mx-auto px-0 py-0">
    <div class="bg-[var(--pv-bg-tertiary)] border-b border-[var(--pv-border)] p-4 shadow-[inset_0px_5px_15px_-3px_rgba(0,_0,_0,_0.2)]">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- Search -->
            <div class="md:col-span-2">
                <input
                        type="text"
                        x-model="filters.search"
                        @input.debounce.300ms="onSearchChanged()"
                        placeholder="Search prompts..."
                        class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                   bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                   placeholder:text-[var(--pv-muted-text)]
                                   focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                >
            </div>

            <!-- Category -->
            <div>
                <select
                        x-model="filters.category"
                        @change="onCategoryChanged()"
                        class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                   bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                   focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                >
                    <option value="">All Categories</option>
                    <template x-for="cat in categories" :key="cat">
                        <option :value="cat" x-text="cat"></option>
                    </template>
                </select>
            </div>

            <!-- Sort -->
            <div>
                <select
                        x-model="filters.sort"
                        @change="syncFilterQueryFromFilters(); applyFilters()"
                        class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                   bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                   focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                >
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="rating">Highest Rated</option>
                    <option value="alpha">Alphabetical</option>
                </select>
            </div>
        </div>

        <!-- Filter Query (advanced) -->
        <div class="mt-3">
            <div class="flex items-center justify-between gap-2">
                <label class="text-xs font-medium text-[var(--pv-muted-text)]">Filter query</label>
                <button
                        @click="advancedOpen = !advancedOpen"
                        class="text-xs px-2 py-1 rounded border border-[var(--pv-border)]
                                   bg-[var(--pv-bg-tertiary)] text-[var(--pv-muted-text)]
                                   hover:bg-[var(--pv-hover)] transition"
                        x-text="advancedOpen ? 'Hide JSON' : 'Show JSON'"
                ></button>
            </div>

            <input
                    type="text"
                    x-model="filterQuery"
                    @input.debounce.350ms="applyFilterQuery()"
                    placeholder="e.g. cat:Trading tag:nt8 featured title:/EMA|VWAP/i"
                    class="mt-1 w-full px-3 py-2 border border-[var(--pv-border)] rounded-lg
                               bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                               placeholder:text-[var(--pv-muted-text)]
                               focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none text-sm"
            >

            <div x-show="advancedOpen" class="mt-2">
                    <textarea
                            x-model="filterJson"
                            @input.debounce.400ms="applyFilterJson()"
                            rows="6"
                            class="w-full px-3 py-2 border border-[var(--pv-border)] rounded-lg
                                   bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                   focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none
                                   font-mono text-xs"
                            spellcheck="false"
                    ></textarea>
                <p class="mt-1 text-xs text-[var(--pv-muted-text)]">
                    Supported regex shape: <code>{"regex":{"title":{"pattern":"...","flags":"i"},"content":...,"tags":...}}</code>
                </p>
            </div>
        </div>

        <!-- Tag Filters -->
        <div class="mt-4 flex flex-wrap gap-2" x-show="allTags.length > 0">
            <template x-for="tag in allTags" :key="tag.id">
                <button
                        @click="toggleTag(tag.name)"
                        :class="filters.tags.includes(tag.name)
                                ? 'bg-[var(--pv-selected)] text-[var(--pv-text)] border-[var(--pv-border)]'
                                : 'bg-[var(--pv-bg-tertiary)] text-[var(--pv-muted-text)] border-[var(--pv-border)] hover:bg-[var(--pv-hover)]'"
                        class="px-3 py-1 rounded-full text-sm font-medium border transition"
                        x-text="tag.name"
                ></button>
            </template>
        </div>
    </div>
</div>
