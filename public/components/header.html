<header
  class="sticky top-0 z-30 pv-shadow-sm"
  style="
    background: var(--pv-bg-header);
    border-bottom: 1px solid var(--pv-border);
  "
>
  <div class="max-w-7xl mx-auto px-4 py-4 space-y-3">
    <!-- ============================= -->
    <!-- Top row -->
    <!-- ============================= -->
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 leading-none">
          <span class="pv-logo w-9 h-9"></span>
          <h1 class="text-2xl font-bold">PromptVault</h1>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <button
          type="button"
          @click="openSettings()"
          class="pv-btn pv-btn-icon pv-btn-secondary shrink-0"
          title="Settings"
          aria-label="Settings"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 6h3m-1.5 12h.008v.008H12V18Zm8.25-6a8.25 8.25 0 0 0-.096-1.25l2.003-1.559a.75.75 0 0 0 .171-.951l-1.9-3.29a.75.75 0 0 0-.91-.334l-2.356.942a8.197 8.197 0 0 0-2.165-1.25l-.357-2.5A.75.75 0 0 0 12.75 1.5h-3.5a.75.75 0 0 0-.742.64l-.357 2.5a8.197 8.197 0 0 0-2.165 1.25l-2.356-.942a.75.75 0 0 0-.91.334l-1.9 3.29a.75.75 0 0 0 .171.951l2.003 1.559A8.25 8.25 0 0 0 3 12c0 .425.032.842.096 1.25l-2.003 1.559a.75.75 0 0 0-.171.951l1.9 3.29c.2.346.61.49.91.334l2.356-.942c.66.512 1.38.93 2.165 1.25l.357 2.5c.06.36.37.64.742.64h3.5c.372 0 .682-.28.742-.64l.357-2.5a8.197 8.197 0 0 0 2.165-1.25l2.356.942c.3.156.71.012.91-.334l1.9-3.29a.75.75 0 0 0-.171-.951l-2.003-1.559c.064-.408.096-.825.096-1.25Zm-6.75 3a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- ============================= -->
    <!-- Pages bar -->
    <!-- ============================= -->
    <div
      hx-get="/components/pages-bar.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>
  </div>
</header>
