<div
  class="prompt-card group pv-shadow-sm hover:pv-shadow-md transition relative rounded-xl cursor-pointer"
  style="background: var(--pv-bg-surface); border: 1px solid var(--pv-border)"
  @click="copyPrompt(prompt)"
>
  <div class="p-4 flex flex-col gap-2">
    <div class="flex items-start gap-2">
      <button
        type="button"
        class="pv-feature shrink-0"
        :data-on="prompt.is_featured ? 1 : 0"
        @click.stop="toggleFeatured(prompt)"
        title="Toggle featured"
        aria-label="Toggle featured"
      >
        ★
      </button>

      <h3
        class="font-semibold leading-tight flex-1 min-w-0 pr-12"
        x-text="prompt.title"
      ></h3>

      <div
        class="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition"
      >
        <span
          class="pv-icon-action"
          @click.stop="openEditor(prompt)"
          title="Edit"
          aria-label="Edit"
          >✎</span
        >

        <span
          class="pv-icon-action pv-icon-action-danger"
          @click.stop="deletePrompt(prompt.id)"
          title="Delete"
          aria-label="Delete"
          >×</span
        >
      </div>
    </div>

    <p
      class="text-sm text-[var(--pv-text-muted)] line-clamp-2"
      x-text="prompt.preview ?? getPreview(prompt.content)"
    ></p>

    <div class="flex items-center justify-between pt-2 gap-3">
      <div class="flex flex-wrap gap-1.5 min-w-0">
        <template x-for="tag in (prompt.tags || [])" :key="tag.id ?? tag">
          <span
            class="pv-tag px-2 py-0.5 rounded text-xs font-medium"
            x-text="tag.name ?? tag"
          ></span>
        </template>
      </div>

      <div
        class="pv-rating"
        :style="`--pv-rating:${value ?? 0}`"
        aria-hidden="true"
      ></div>
    </div>
  </div>
</div>
