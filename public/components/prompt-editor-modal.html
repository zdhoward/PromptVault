<div
        x-show="showEditor"
        x-cloak
        @click.self="closeEditor()"
        class="fixed inset-0 flex items-center justify-center z-50 p-4"
        style="background: var(--pv-overlay);"
>
    <div class="modal w-full pv-shadow-xl max-w-3xl max-h-[90vh] overflow-y-auto" style="background: var(--pv-bg-elevated); border: 1px solid var(--pv-border);">
        <div class="p-6">
            <div class="flex items-center justify-between mb-4 gap-3">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <button
                            type="button"
                            class="pv-feature shrink-0"
                            :data-on="editingPrompt.is_featured ? 1 : 0"
                            @click="editingPrompt.is_featured = !editingPrompt.is_featured"
                            title="Featured"
                            aria-label="Toggle featured"
                    >★</button>

                    <h2
                            class="text-xl font-bold truncate"
                            x-text="editingPrompt.id ? 'Edit Prompt' : 'New Prompt'"
                    ></h2>
                </div>

                <button
                        type="button"
                        class="pv-btn pv-btn-icon pv-btn-secondary"
                        @click="closeEditor()"
                        aria-label="Close"
                        title="Close"
                >
                    ×
                </button>
            </div>

            <div class="space-y-4">
                <!-- Title -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-text-muted)] mb-1">Title</label>
                    <input
                            type="text"
                            x-model="editingPrompt.title"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                            style="
                                background: var(--pv-bg-input);
                                color: var(--pv-text-input);
                                border-color: var(--pv-border-input);
                                --tw-ring-color: var(--pv-focus-ring);
                            "
                            placeholder="Prompt title..."
                    >
                </div>

                <!-- Content -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-text-muted)] mb-1">Content (Markdown supported)</label>
                    <textarea
                            x-model="editingPrompt.content"
                            rows="12"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 font-mono text-sm"
                            style="
                                background: var(--pv-bg-input);
                                color: var(--pv-text-input);
                                border-color: var(--pv-border-input);
                                --tw-ring-color: var(--pv-focus-ring);
                            "
                            placeholder="Your prompt here..."
                    ></textarea>
                </div>

                <!-- Category & Rating -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--pv-text-muted)] mb-1">Category</label>
                        <input
                                type="text"
                                x-model="editingPrompt.category"
                                list="categories"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                                style="
                                    background: var(--pv-bg-input);
                                    color: var(--pv-text-input);
                                    border-color: var(--pv-border-input);
                                    --tw-ring-color: var(--pv-focus-ring);
                                "
                                placeholder="e.g., Trading, Coding..."
                        >
                        <datalist id="categories">
                            <template x-for="cat in categories" :key="cat">
                                <option :value="cat"></option>
                            </template>
                        </datalist>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-[var(--pv-text-muted)] mb-1">Rating (0-5)</label>
                        <input
                                type="number"
                                x-model.number="editingPrompt.rating"
                                min="0"
                                max="5"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                                style="
                                    background: var(--pv-bg-input);
                                    color: var(--pv-text-input);
                                    border-color: var(--pv-border-input);
                                    --tw-ring-color: var(--pv-focus-ring);
                                "
                        >
                    </div>
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-text-muted)] mb-1">Tags (comma-separated)</label>
                    <input
                            type="text"
                            x-model="tagsInput"
                            @input="updateTags()"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                            style="
                                background: var(--pv-bg-input);
                                color: var(--pv-text-input);
                                border-color: var(--pv-border-input);
                                --tw-ring-color: var(--pv-focus-ring);
                            "
                            placeholder="trading, analysis, technical..."
                    >
                    <div class="flex flex-wrap gap-2 mt-2">
                        <template x-for="tag in (editingPrompt.tags || [])" :key="tag">
                            <span class="pv-tag px-2 py-1 rounded text-sm border border-[var(--pv-border)]" x-text="tag"></span>
                        </template>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-4">
                    <button
                            type="button"
                            class="flex-1 pv-btn pv-btn-normal pv-btn-primary"
                            @click="savePrompt()"
                    >
                        Save Prompt
                    </button>

                    <button
                            type="button"
                            class="pv-btn pv-btn-normal pv-btn-danger"
                            @click="closeEditor()"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
