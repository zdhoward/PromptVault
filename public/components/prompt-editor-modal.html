<div
        x-show="showEditor"
        x-cloak
        @click.self="closeEditor()"
        class="fixed inset-0 bg-[var(--pv-overlay)] flex items-center justify-center z-50 p-4"
>
    <div class="bg-[var(--pv-card-bg)] rounded-lg shadow-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto border border-[var(--pv-border)]">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-[var(--pv-title)]" x-text="editingPrompt.id ? 'Edit Prompt' : 'New Prompt'"></h2>
                <button @click="closeEditor()" class="text-[var(--pv-muted-text)] hover:text-[var(--pv-text)] text-2xl transition">×</button>
            </div>

            <div class="space-y-4">
                <!-- Title -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-muted-text)] mb-1">Title</label>
                    <input
                            type="text"
                            x-model="editingPrompt.title"
                            class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                       bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                       placeholder:text-[var(--pv-muted-text)]
                                       focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                            placeholder="Prompt title..."
                    >
                </div>

                <!-- Content -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-muted-text)] mb-1">Content (Markdown supported)</label>
                    <textarea
                            x-model="editingPrompt.content"
                            rows="12"
                            class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                       bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                       placeholder:text-[var(--pv-muted-text)]
                                       focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none
                                       font-mono text-sm"
                            placeholder="Your prompt here..."
                    ></textarea>
                </div>

                <!-- Category & Rating -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[var(--pv-muted-text)] mb-1">Category</label>
                        <input
                                type="text"
                                x-model="editingPrompt.category"
                                list="categories"
                                class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                           bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                           placeholder:text-[var(--pv-muted-text)]
                                           focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                                placeholder="e.g., Trading, Coding..."
                        >
                        <datalist id="categories">
                            <template x-for="cat in categories" :key="cat">
                                <option :value="cat"></option>
                            </template>
                        </datalist>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-[var(--pv-muted-text)] mb-1">Rating (0-5)</label>
                        <input
                                type="number"
                                x-model.number="editingPrompt.rating"
                                min="0"
                                max="5"
                                class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                           bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                           focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                        >
                    </div>
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-sm font-medium text-[var(--pv-muted-text)] mb-1">Tags (comma-separated)</label>
                    <input
                            type="text"
                            x-model="tagsInput"
                            @input="updateTags()"
                            class="w-full px-4 py-2 border border-[var(--pv-border)] rounded-lg
                                       bg-[var(--pv-bg-tertiary)] text-[var(--pv-text)]
                                       placeholder:text-[var(--pv-muted-text)]
                                       focus:ring-2 focus:ring-[var(--pv-primary)] focus:outline-none"
                            placeholder="trading, analysis, technical..."
                    >
                    <div class="flex flex-wrap gap-2 mt-2">
                        <template x-for="tag in editingPrompt.tags" :key="tag">
                            <span class="bg-[var(--pv-bg-tertiary)] text-[var(--pv-accent)] px-2 py-1 rounded text-sm border border-[var(--pv-border)]" x-text="tag"></span>
                        </template>
                    </div>
                </div>

                <!-- Featured -->
                <div class="flex items-center gap-2">
                    <input
                            type="checkbox"
                            x-model="editingPrompt.is_featured"
                            id="featured"
                            class="rounded border-[var(--pv-border)] text-[var(--pv-primary)] focus:ring-[var(--pv-primary)]"
                    >
                    <label for="featured" class="text-sm font-medium text-[var(--pv-muted-text)]">Mark as featured</label>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-4">
                    <button
                            @click="savePrompt()"
                            class="flex-1 bg-[var(--pv-primary)] hover:opacity-90 text-white px-4 py-2 rounded-lg font-medium transition"
                    >
                        Save Prompt
                    </button>
                    <button
                            @click="closeEditor()"
                            class="px-4 py-2 border border-[var(--pv-border)] rounded-lg bg-[var(--pv-bg-tertiary)] hover:bg-[var(--pv-hover)] transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
