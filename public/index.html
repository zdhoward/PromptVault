<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptVault</title>

    <!-- Prevent Alpine flash -->
    <style>
        [x-cloak] { display: none !important; }

        /* Global utility: logo tinting */
        .pv-logo {
            filter: var(--pv-logo-filter);
        }
    </style>

    <!-- Tailwind (layout + utilities only) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- =========================================================
         THEME SYSTEM
         - default.css defines :root (baseline theme)
         - html.theme-* overrides variables
         ========================================================= -->
    <link rel="stylesheet" href="/themes/dark.css">
    <link rel="stylesheet" href="/themes/light.css">
    <link rel="stylesheet" href="/themes/blue-lime.css">
    <link rel="stylesheet" href="/themes/vintage.css">
    <link rel="stylesheet" href="/themes/angsty-robot.css">
    <link rel="stylesheet" href="/themes/high-contrast.css">
    <link rel="stylesheet" href="/themes/nord-slate.css">
    <link rel="stylesheet" href="/themes/mono-ink.css">

    <!-- Third-party libs (ORDER MATTERS) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- App JS (extracted, unchanged logic) -->
    <script src="/js/app.js"></script>
</head>

<body>
<div
        id="app"
        class="min-h-screen transition-colors bg-[var(--pv-bg)] text-[var(--pv-text)]"
        x-data="promptVault()"
        x-init="init()"
>
    <!-- Header -->
    <div hx-get="/components/header.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Filters & Search -->
    <div hx-get="/components/filters.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Prompts Grid/List -->
    <div hx-get="/components/prompts.html" hx-trigger="load" hx-swap="innerHTML"></div>


    <!-- Toast Notification -->
    <div hx-get="/components/toast.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Settings Modal -->
    <div hx-get="/components/settings-modal.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Prompt Editor Modal -->
    <div hx-get="/components/prompt-editor-modal.html" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Page Editor Modal -->
    <div hx-get="/components/page-editor-modal.html" hx-trigger="load" hx-swap="innerHTML"></div>
</div>
</body>
</html>
